<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARPIT's Gaming Hub</title>
    <style>
        body {
            background-color: #0f0f12;
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
        }

        header {
            text-align: center;
            margin-top: 20px;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 3rem;
            margin: 0;
            letter-spacing: 4px;
            text-transform: uppercase;
            background: linear-gradient(45deg, #00ffcc, #0077ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(0, 255, 204, 0.3);
        }

        .subtitle {
            color: #888;
            font-size: 1.1rem;
            margin-top: 5px;
            letter-spacing: 1px;
        }

        #game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #16161e;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid #232334;
            margin-bottom: 30px;
        }

        #score-board {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 15px;
            color: #00ffcc;
        }

        canvas {
            background-color: #0d0d11;
            border: 3px solid #0077ff;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0, 119, 255, 0.4);
        }

        .game-over-text {
            color: #ff3366;
            font-weight: bold;
        }

        .instructions {
            margin-top: 15px;
            font-size: 0.9rem;
            color: #666;
            text-align: center;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <header>
        <h1>ARPIT</h1>
        <div class="subtitle">Welcome to my arcade zone</div>
    </header>

    <div id="game-container">
        <div id="score-board">Score: <span id="score">0</span></div>
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <div class="instructions">
            Use <b>Arrow Keys</b> to steer.<br>
            Press <b>Spacebar</b> to restart if you crash.
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");

        const gridSize = 20; 
        const tileCount = canvas.width / gridSize;
        
        // CHANGED: Increased the interval to 180ms to significantly slow down the speed
        const gameSpeed = 180; 

        let snake = [{ x: 10, y: 10 }];
        let food = { x: 5, y: 5 };
        let dx = 1; 
        let dy = 0; 
        let score = 0;
        let gameInterval;

        function startGame() {
            resetFoodPosition();
            gameInterval = setInterval(updateGame, gameSpeed);
        }

        function updateGame() {
            moveSnake();

            if (checkGameOver()) {
                clearInterval(gameInterval);
                scoreElement.innerHTML = `${score} <span class="game-over-text">— Game Over! Press Space to Restart</span>`;
                return;
            }

            checkFoodCollision();
            drawGame();
        }

        function drawGame() {
            ctx.fillStyle = "#0d0d11";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            snake.forEach((part, index) => {
                ctx.fillStyle = index === 0 ? "#00ffcc" : "#00b38f"; 
                ctx.fillRect(part.x * gridSize, part.y * gridSize, gridSize - 2, gridSize - 2);
            });

            ctx.fillStyle = "#ff3366";
            ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize - 2, gridSize - 2);
        }

        function moveSnake() {
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };
            snake.unshift(head);
            snake.pop(); 
        }

        function checkGameOver() {
            const head = snake[0];
            
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                return true;
            }

            for (let i = 1; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    return true;
                }
            }
            return false;
        }

        function checkFoodCollision() {
            const head = snake[0];
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreElement.textContent = score;
                snake.push({ ...snake[snake.length - 1] });
                resetFoodPosition();
            }
        }

        function resetFoodPosition() {
            food.x = Math.floor(Math.random() * tileCount);
            food.y = Math.floor(Math.random() * tileCount);

            snake.forEach(part => {
                if (part.x === food.x && part.y === food.y) {
                    resetFoodPosition();
                }
            });
        }

        // CHANGED: Key logic updated to explicitly allow only Arrow Keys
        document.addEventListener("keydown", event => {
            const keyPressed = event.key;
            
            if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(keyPressed)) {
                event.preventDefault();
            }

            if (keyPressed === "ArrowLeft" && dx === 0) {
                dx = -1; dy = 0;
            }
            if (keyPressed === "ArrowRight" && dx === 0) {
                dx = 1; dy = 0;
            }
            if (keyPressed === "ArrowUp" && dy === 0) {
                dx = 0; dy = -1;
            }
            if (keyPressed === "ArrowDown" && dy === 0) {
                dx = 0; dy = 1;
            }

            if (keyPressed === " " && checkGameOver()) {
                snake = [{ x: 10, y: 10 }];
                dx = 1;
                dy = 0;
                score = 0;
                scoreElement.textContent = score;
                startGame();
            }
        });

        startGame();
    </script>
</body>
</html>
